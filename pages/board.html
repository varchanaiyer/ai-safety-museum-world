<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Departures</title>
<style>html,body{margin:0;height:100%;background:#0c1220;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c" width="2560" height="512"></canvas>
<script src="board.js"></script>
<script>
/* the AGI departures board, lifted from the museum's engine */
const g=document.getElementById("c").getContext("2d");
function scramble(t){const gl="#@%&*+=-";let o="";for(const c of t)o+=(c===" "||Math.random()<0.5)?c:gl[(Math.random()*gl.length)|0];return o;}
function draw(){
  g.setTransform(2,0,0,2,0,0);
  g.fillStyle="rgb(12,18,32)";g.fillRect(0,0,1280,256);
  g.strokeStyle="rgba(126,195,232,0.55)";g.lineWidth=2;g.strokeRect(6,6,1268,244);
  g.textAlign="left";g.font="600 15px 'Courier New',monospace";g.fillStyle="rgb(126,195,232)";
  g.fillText("DEPARTURES · MACHINE INTELLIGENCE",40,34);g.textAlign="right";g.fillText("PLATFORM 1",1240,34);
  g.fillStyle="rgba(126,195,232,0.4)";g.fillRect(40,44,1200,1);
  g.textAlign="left";g.font="600 12px 'Courier New',monospace";g.fillStyle="rgba(190,204,224,0.6)";
  g.fillText("FORECAST",40,64);g.fillText("FORECASTER",240,64);g.fillText("ARRIVAL",640,64);g.fillText("STATUS",840,64);
  g.font="600 17px 'Courier New',monospace";
  BOARDROWS.forEach((r,i)=>{const y=88+i*20,flick=Math.random()<0.12;g.fillStyle="rgb(226,232,240)";
    g.fillText(flick?scramble(r[0]):r[0],40,y);g.fillText(r[1],240,y);g.fillText(i===6?String(2031+((Math.random()*5)|0)):r[2],640,y);
    g.fillStyle=r[4];g.fillText(flick?scramble(r[3]):r[3],840,y);});
  if(Math.floor(Date.now()/700)%2===0){g.fillStyle="#e8c76a";g.fillRect(938,216,10,14);}
}
draw();setInterval(draw,900);
</script></body></html>
